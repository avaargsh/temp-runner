name: authority-diff-kill-test

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: authority-diff-kill-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  kill-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout runner
        uses: actions/checkout@v4

      - name: Record immutable runner SHA
        id: runner
        run: echo "runner_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Read authority diff source lock
        id: lock
        run: python scripts/emit_authority_diff_lock.py --github-output "$GITHUB_OUTPUT"

      - name: Checkout pinned agent-control-plane
        uses: actions/checkout@v4
        with:
          repository: avaargsh/agent-control-plane
          ref: ${{ steps.lock.outputs.control_plane_ref }}
          path: workspace/agent-control-plane

      - name: Checkout pinned cloud-agent-runtime
        uses: actions/checkout@v4
        with:
          repository: avaargsh/cloud-agent-runtime
          ref: ${{ steps.lock.outputs.runtime_ref }}
          path: workspace/cloud-agent-runtime

      - name: Checkout pinned agentic-aiops
        uses: actions/checkout@v4
        with:
          repository: avaargsh/agentic-aiops
          ref: ${{ steps.lock.outputs.aiops_ref }}
          path: workspace/agentic-aiops

      - name: Verify borrowed source shapes
        run: |
          set -euo pipefail
          grep -q 'class AuthorityGrant' workspace/agent-control-plane/src/agent_control_plane/authority.py
          grep -q 'def build_authority_inventory' workspace/agent-control-plane/src/agent_control_plane/authority.py
          grep -q 'class FrozenEvidence' workspace/agent-control-plane/src/agent_control_plane/frozen_evidence.py
          grep -q 'class Run' workspace/cloud-agent-runtime/src/cloud_agent_runtime/models.py
          grep -q 'class SandboxBinding' workspace/cloud-agent-runtime/src/cloud_agent_runtime/models.py
          grep -q 'sandbox_ref:' workspace/cloud-agent-runtime/src/cloud_agent_runtime/models.py
          test -s workspace/agentic-aiops/demo/k8s/golden-stack.yaml
          test -s workspace/agent-control-plane/examples/cross_agent_context/codex.config.toml
          test -s workspace/agent-control-plane/examples/cross_agent_context/claude.mcp.json

      - name: Install experiment dependency
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Run round one through authority-diff CLI
        run: |
          python experiments/effective-authority-diff/run.py             --round 1             --out artifacts/effective-authority-diff/round-1
          cat artifacts/effective-authority-diff/round-1/summary.txt

      - name: Build round-two cases from pinned real repo files
        run: |
          python experiments/effective-authority-diff/build_round2_cases.py             --workspace workspace             --source-lock authority-diff-lock.json             --output artifacts/effective-authority-diff/round-2-cases.json

      - name: Run round two through authority-diff CLI
        run: |
          python experiments/effective-authority-diff/run.py             --round 2             --cases artifacts/effective-authority-diff/round-2-cases.json             --out artifacts/effective-authority-diff/round-2
          cat artifacts/effective-authority-diff/round-2/summary.txt

      - name: Validate read-only admission artifact binding
        run: |
          python experiments/effective-authority-diff/test_admission_input.py

      - name: Add immutable refs
        if: always()
        run: |
          mkdir -p artifacts/effective-authority-diff
          {
            printf 'runner_sha=%s\n' "${{ steps.runner.outputs.runner_sha }}"
            printf 'control_plane_sha=%s\n' "${{ steps.lock.outputs.control_plane_ref }}"
            printf 'runtime_sha=%s\n' "${{ steps.lock.outputs.runtime_ref }}"
            printf 'aiops_sha=%s\n' "${{ steps.lock.outputs.aiops_ref }}"
          } > artifacts/effective-authority-diff/refs.txt

      - name: Upload content-addressed experiment artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: effective-authority-diff-${{ github.run_id }}
          path: artifacts/effective-authority-diff/
          retention-days: 14
