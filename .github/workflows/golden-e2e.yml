name: golden-e2e

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      aiops_ref:
        description: agentic-aiops ref
        required: true
        default: main
      decision_ref:
        description: agent-decision-lab ref
        required: true
        default: main
      runtime_ref:
        description: cloud-agent-runtime ref
        required: true
        default: main
      control_plane_ref:
        description: agent-control-plane ref
        required: true
        default: main

permissions:
  contents: read

jobs:
  golden:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout runner
        uses: actions/checkout@v4

      - name: Record immutable source SHAs
        id: runner-ref
        run: echo "runner_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Checkout agentic-aiops
        uses: actions/checkout@v4
        with:
          repository: avaargsh/agentic-aiops
          ref: ${{ inputs.aiops_ref || 'main' }}
          path: workspace/agentic-aiops

      - name: Checkout agent-decision-lab
        uses: actions/checkout@v4
        with:
          repository: avaargsh/agent-decision-lab
          ref: ${{ inputs.decision_ref || 'main' }}
          path: workspace/agent-decision-lab

      - name: Checkout cloud-agent-runtime
        uses: actions/checkout@v4
        with:
          repository: avaargsh/cloud-agent-runtime
          ref: ${{ inputs.runtime_ref || 'main' }}
          path: workspace/cloud-agent-runtime

      - name: Validate private repository credential
        env:
          AGENT_STACK_GITHUB_TOKEN: ${{ secrets.AGENT_STACK_GITHUB_TOKEN }}
        run: |
          if [ -z "$AGENT_STACK_GITHUB_TOKEN" ]; then
            echo "::error::AGENT_STACK_GITHUB_TOKEN is required while agent-control-plane is private"
            exit 2
          fi

      - name: Checkout agent-control-plane
        uses: actions/checkout@v4
        with:
          repository: avaargsh/agent-control-plane
          ref: ${{ inputs.control_plane_ref || 'main' }}
          token: ${{ secrets.AGENT_STACK_GITHUB_TOKEN || github.token }}
          path: workspace/agent-control-plane

      - name: Install kind
        uses: helm/kind-action@v1
        with:
          install_only: true

      - name: Create disposable cluster
        working-directory: workspace/agentic-aiops
        run: bash ./scripts/setup-golden-kind.sh

      - name: Show cluster state
        run: |
          kubectl get nodes -o wide
          kubectl -n golden-demo get all

      - name: Install source dependencies
        run: |
          python -m pip install -U pip
          pip install -e "workspace/cloud-agent-runtime[temporal]"
          pip install -e "workspace/agent-decision-lab"
          pip install -e "workspace/agentic-aiops[dev]"
          pip install -e "workspace/agent-control-plane"
          curl -fsSL https://github.com/temporalio/cli/releases/download/v1.9.1/temporal_cli_1.9.1_linux_amd64.tar.gz | tar -xz -C /usr/local/bin temporal

      - name: Validate source contracts
        working-directory: workspace/agentic-aiops
        run: |
          pytest -q tests/test_golden_demo_assets.py tests/test_live_remediation.py tests/test_live_temporal_contract.py tests/test_authority_chain.py
          cd ../agent-control-plane
          pytest -q tests/test_authority.py tests/test_authority_cli.py tests/test_release_gate.py

      - name: Run Golden Incident E2E
        working-directory: workspace/agentic-aiops
        env:
          TEMPORAL_ADDRESS: 127.0.0.1:7233
          TEMPORAL_TASK_QUEUE: agent-runs
          DECISION_GATEWAY_URL: http://127.0.0.1:8080
          PROMETHEUS_URL: http://127.0.0.1:19090
          KUBERNETES_API: http://127.0.0.1:18001
          AGENT_RELEASE_NAME: checkout-remediator-v2
        run: |
          set -euo pipefail
          RUN_ID="golden-ci-$GITHUB_RUN_ID"
          temporal server start-dev --ip 127.0.0.1 --port 7233 > /tmp/temporal.log 2>&1 &
          cloud-agent-runtime-worker > /tmp/runtime-worker.log 2>&1 &
          decision-lab-server --mode demo --host 127.0.0.1 --port 8080 > /tmp/decision.log 2>&1 &
          kubectl -n golden-demo port-forward svc/prometheus 19090:9090 > /tmp/prometheus-pf.log 2>&1 &
          kubectl proxy --port=18001 > /tmp/kube-proxy.log 2>&1 &
          wait_http() {
            local url="$1"
            for _ in $(seq 1 60); do
              if curl -fsS "$url" >/dev/null 2>&1; then return 0; fi
              sleep 1
            done
            echo "endpoint not ready: $url" >&2
            return 1
          }
          wait_http "http://127.0.0.1:8080/health" || wait_http "http://127.0.0.1:8080/docs"
          wait_http "http://127.0.0.1:19090/-/ready"
          wait_http "http://127.0.0.1:18001/version"
          temporal_ready() {
            for _ in $(seq 1 60); do
              if temporal operator cluster health --address 127.0.0.1:7233 >/dev/null 2>&1; then return 0; fi
              sleep 1
            done
            echo "Temporal cluster not ready" >&2
            return 1
          }
          temporal_ready

          # Deployment-time authority inventory + drift admission.
          printf '%s\n' '{"apiVersion":"agentplane.io/v1alpha1","kind":"AgentAuthorityEnvelope","metadata":{"name":"checkout-remediator-prod"},"spec":{"fleetRef":"sre-prod","teamRef":"team://sre-platform","agentRef":"checkout-remediator","releaseRef":"checkout-remediator-v1","runtimeRefs":["temporal://prod/checkout-remediator","sandbox://prod/checkout-remediator"],"grants":[{"effect":"read","capability":"kubernetes.read","resource":"kubernetes://prod/checkout/*","verbs":["get","list"]},{"effect":"write","capability":"kubernetes.scale","resource":"kubernetes://prod/checkout/deployment/checkout-api","verbs":["scale"]}],"constraints":{"approvalMode":"human-exact","evidenceRequired":true,"maxOperationsPerRun":1}}}' > /tmp/authority-baseline.json
          printf '%s\n' '{"apiVersion":"agentplane.io/v1alpha1","kind":"AgentAuthorityEnvelope","metadata":{"name":"checkout-remediator-prod"},"spec":{"fleetRef":"sre-prod","teamRef":"team://sre-platform","agentRef":"checkout-remediator","releaseRef":"checkout-remediator-v2","runtimeRefs":["temporal://prod/checkout-remediator","sandbox://prod/checkout-remediator"],"grants":[{"effect":"read","capability":"kubernetes.read","resource":"kubernetes://prod/checkout/*","verbs":["get","list"]},{"effect":"write","capability":"kubernetes.scale","resource":"kubernetes://prod/checkout/deployment/checkout-api","verbs":["scale"]}],"constraints":{"approvalMode":"human-exact","evidenceRequired":true,"maxOperationsPerRun":1}}}' > /tmp/authority-proposed.json
          printf '%s\n' '{"apiVersion":"agentplane.io/v1alpha1","kind":"AgentAuthorityEnvelope","metadata":{"name":"checkout-remediator-prod"},"spec":{"fleetRef":"sre-prod","teamRef":"team://sre-platform","agentRef":"checkout-remediator","releaseRef":"checkout-remediator-v2","runtimeRefs":["temporal://prod/checkout-remediator","sandbox://prod/checkout-remediator"],"grants":[{"effect":"read","capability":"kubernetes.read","resource":"kubernetes://prod/checkout/*","verbs":["get","list"]},{"effect":"write","capability":"kubernetes.scale","resource":"kubernetes://prod/checkout/deployment/checkout-api","verbs":["scale"]},{"effect":"write","capability":"kubernetes.delete","resource":"kubernetes://prod/checkout/pod/*","verbs":["delete"]}],"constraints":{"approvalMode":"human-exact","evidenceRequired":true,"maxOperationsPerRun":1}}}' > /tmp/authority-expanded.json

          agent-control-plane authority-inventory /tmp/authority-proposed.json | tee /tmp/authority-inventory.json
          agent-control-plane authority-admit /tmp/authority-proposed.json --baseline /tmp/authority-baseline.json | tee /tmp/authority-admission.json
          grep -q '"decision": "ADMIT"' /tmp/authority-admission.json
          export AGENT_AUTHORITY_DIGEST="$(python -c 'import json; print(json.load(open("/tmp/authority-admission.json"))["proposed_digest"])')"

          set +e
          agent-control-plane authority-admit /tmp/authority-expanded.json --baseline /tmp/authority-baseline.json > /tmp/authority-deny.json 2>&1
          AUTHORITY_DENY_RC=$?
          set -e
          test "$AUTHORITY_DENY_RC" = "3"
          grep -q '"decision": "DENY"' /tmp/authority-deny.json
          grep -q 'AUTHORITY_EXPANSION' /tmp/authority-deny.json

          kubectl -n golden-demo scale deploy/load-generator --replicas=1
          kubectl -n golden-demo rollout status deploy/load-generator --timeout=120s
          sleep 8
          python examples/live_golden_incident.py start --run-id "$RUN_ID" | tee /tmp/start.json
          python examples/live_golden_incident.py status --run-id "$RUN_ID" | tee /tmp/waiting.json
          grep -q '"paused": true' /tmp/waiting.json
          test "$(kubectl -n golden-demo get deploy checkout-api -o jsonpath='{.spec.replicas}')" = "2"

          # Negative control: an unrelated approval must not authorize the frozen action.
          golden-approval approve --run-id "$RUN_ID" --approval-id approval-for-another-action --reason "negative control" | tee /tmp/wrong-approval.json
          python examples/live_golden_incident.py continue --run-id "$RUN_ID" | tee /tmp/after-wrong-approval.json
          test "$(kubectl -n golden-demo get deploy checkout-api -o jsonpath='{.spec.replicas}')" = "2"
          python examples/live_golden_incident.py status --run-id "$RUN_ID" | tee /tmp/still-waiting.json
          grep -q '"terminal": false' /tmp/still-waiting.json

          APPROVAL_ID=$(python examples/live_golden_incident.py status --run-id "$RUN_ID" | python -c 'import json,sys; d=json.load(sys.stdin); xs=d.get("pending_approval_ids") or []; assert len(xs)==1, f"expected one pending approval, got {xs}"; print(xs[0])')
          golden-approval approve --run-id "$RUN_ID" --approval-id "$APPROVAL_ID" --reason "GitHub Actions Golden Incident E2E" | tee /tmp/approval.json

          # Duplicate delivery is a normal distributed-systems failure mode.
          # Temporal must deduplicate the same approval identity.
          golden-approval approve --run-id "$RUN_ID" --approval-id "$APPROVAL_ID" --reason "duplicate delivery negative control" | tee /tmp/duplicate-approval.json
          python examples/live_golden_incident.py status --run-id "$RUN_ID" | tee /tmp/after-duplicate-approval.json
          python - <<'PY'
          import json
          d=json.load(open("/tmp/after-duplicate-approval.json"))
          aid=json.load(open("/tmp/waiting.json"))["pending_approval_ids"][0]
          events=[e for e in d.get("approval_events", []) if e.get("approval_id")==aid]
          assert len(events)==1, f"approval was not deduplicated: {events}"
          PY

          python examples/live_golden_incident.py continue --run-id "$RUN_ID" | tee /tmp/continue.json
          test "$(kubectl -n golden-demo get deploy checkout-api -o jsonpath='{.spec.replicas}')" = "4"
          grep -q '"status": "VERIFIED"' /tmp/continue.json
          grep -q '"passed": true' /tmp/continue.json
          python examples/live_golden_incident.py status --run-id "$RUN_ID" | tee /tmp/complete.json
          grep -q '"terminal": true' /tmp/complete.json
          grep -q '"phase": "succeeded"' /tmp/complete.json

          # Retry after the side effect + receipt are durable. This must reuse
          # the same receipt rather than issue a second Kubernetes mutation.
          RECEIPT=$(find ".golden-runs/$RUN_ID/actions" -type f -name '*.json')
          test "$(printf '%s\n' "$RECEIPT" | sed '/^$/d' | wc -l)" = "1"
          RECEIPT_SHA_BEFORE=$(sha256sum "$RECEIPT" | awk '{print $1}')
          python examples/live_golden_incident.py continue --run-id "$RUN_ID" | tee /tmp/retry-continue.json
          RECEIPT_SHA_AFTER=$(sha256sum "$RECEIPT" | awk '{print $1}')
          test "$RECEIPT_SHA_BEFORE" = "$RECEIPT_SHA_AFTER"
          test "$(kubectl -n golden-demo get deploy checkout-api -o jsonpath='{.spec.replicas}')" = "4"

          # The producer seals per-run acceptance evidence; the Control Plane
          # is the only component that decides PROMOTE/BLOCK.
          test -s ".golden-runs/$RUN_ID/release-evidence.json"
          test -s ".golden-runs/$RUN_ID/acceptance-metrics.json"
          agent-control-plane gate demo/control-plane/golden-eval-gate.yaml \
            --metrics ".golden-runs/$RUN_ID/acceptance-metrics.json" \
            --evidence ".golden-runs/$RUN_ID/release-evidence.json" \
            --authority-digest "$AGENT_AUTHORITY_DIGEST" | tee /tmp/release-gate.json
          grep -q '"decision": "PROMOTE"' /tmp/release-gate.json
          python - <<'PY'
          import json, pathlib
          run_dirs=list(pathlib.Path(".golden-runs").glob("golden-ci-*"))
          assert len(run_dirs)==1, run_dirs
          d=json.load(open(run_dirs[0]/"release-evidence.json"))
          assert d["operation_id"], d
          assert d["operation_phase"]=="VERIFIED", d
          assert d["operation_evidence_refs"], d
          assert d["operation_approval_id"], d
          assert d["authority_digest"], d
          PY

          # Negative control: a correctly sealed but non-VERIFIED operation
          # must still be rejected by the Control Plane release invariant.
          cp ".golden-runs/$RUN_ID/release-evidence.json" /tmp/release-evidence-operation-block.json
          python - <<'PY'
          import hashlib, json
          p="/tmp/release-evidence-operation-block.json"
          d=json.load(open(p))
          d["operation_phase"]="VERIFICATION_FAILED"
          payload={k:v for k,v in d.items() if k!="replay_digest"}
          encoded=json.dumps(payload, sort_keys=True, separators=(",", ":"), ensure_ascii=False).encode()
          d["replay_digest"]="sha256:"+hashlib.sha256(encoded).hexdigest()
          json.dump(d, open(p,"w"), indent=2)
          PY
          set +e
          agent-control-plane gate demo/control-plane/golden-eval-gate.yaml \
            --metrics ".golden-runs/$RUN_ID/acceptance-metrics.json" \
            --evidence /tmp/release-evidence-operation-block.json \
            --authority-digest "$AGENT_AUTHORITY_DIGEST" > /tmp/operation-gate.json 2>&1
          OPERATION_GATE_RC=$?
          set -e
          grep -q '"decision": "BLOCK"' /tmp/operation-gate.json
          grep -q '"reason": "OPERATION_NOT_VERIFIED"' /tmp/operation-gate.json
          # BLOCK is the semantic invariant. Record the current CLI exit-code
          # contract without coupling this system proof to it.
          printf '%s\n' "$OPERATION_GATE_RC" > /tmp/operation-gate.exitcode


          # Negative control: correctly sealed evidence from another admitted
          # authority identity must not promote this release.
          cp ".golden-runs/$RUN_ID/release-evidence.json" /tmp/release-evidence-authority-mismatch.json
          python - <<'PY'
          import hashlib, json
          p="/tmp/release-evidence-authority-mismatch.json"
          d=json.load(open(p))
          d["authority_digest"]="sha256:" + "b" * 64
          payload={k:v for k,v in d.items() if k!="replay_digest"}
          encoded=json.dumps(payload, sort_keys=True, separators=(",", ":"), ensure_ascii=False).encode()
          d["replay_digest"]="sha256:"+hashlib.sha256(encoded).hexdigest()
          json.dump(d, open(p,"w"), indent=2)
          PY
          set +e
          agent-control-plane gate demo/control-plane/golden-eval-gate.yaml \
            --metrics ".golden-runs/$RUN_ID/acceptance-metrics.json" \
            --evidence /tmp/release-evidence-authority-mismatch.json \
            --authority-digest "$AGENT_AUTHORITY_DIGEST" > /tmp/authority-mismatch-gate.json 2>&1
          AUTHORITY_MISMATCH_RC=$?
          set -e
          grep -q '"decision": "BLOCK"' /tmp/authority-mismatch-gate.json
          grep -q '"reason": "AUTHORITY_DIGEST_MISMATCH"' /tmp/authority-mismatch-gate.json
          printf '%s\n' "$AUTHORITY_MISMATCH_RC" > /tmp/authority-mismatch-gate.exitcode

          # Negative control: mutation of sealed release evidence must fail closed.
          cp ".golden-runs/$RUN_ID/release-evidence.json" /tmp/release-evidence-mutated.json
          python - <<'PY'
          import json
          p = "/tmp/release-evidence-mutated.json"
          d = json.load(open(p))
          d["bundle_sha256"] = "sha256:mutated"
          json.dump(d, open(p, "w"))
          PY
          set +e
          agent-control-plane gate demo/control-plane/golden-eval-gate.yaml \
            --metrics ".golden-runs/$RUN_ID/acceptance-metrics.json" \
            --evidence /tmp/release-evidence-mutated.json \
            --authority-digest "$AGENT_AUTHORITY_DIGEST" > /tmp/mutation-gate.json 2>&1
          MUTATION_GATE_RC=$?
          set -e
          grep -q '"decision": "BLOCK"' /tmp/mutation-gate.json
          grep -q '"reason": "INVALID_RELEASE_EVIDENCE"' /tmp/mutation-gate.json
          printf '%s\n' "$MUTATION_GATE_RC" > /tmp/mutation-gate.exitcode

          mkdir -p ../../artifacts/run
          cp -R ".golden-runs/$RUN_ID" ../../artifacts/run/
          cp /tmp/start.json /tmp/waiting.json /tmp/wrong-approval.json /tmp/after-wrong-approval.json /tmp/still-waiting.json /tmp/approval.json /tmp/duplicate-approval.json /tmp/after-duplicate-approval.json /tmp/continue.json /tmp/complete.json /tmp/retry-continue.json /tmp/release-gate.json /tmp/operation-gate.json /tmp/operation-gate.exitcode /tmp/authority-inventory.json /tmp/authority-admission.json /tmp/authority-deny.json /tmp/authority-mismatch-gate.json /tmp/authority-mismatch-gate.exitcode /tmp/mutation-gate.json /tmp/mutation-gate.exitcode ../../artifacts/run/

      - name: Capture diagnostics
        if: always()
        run: |
          mkdir -p artifacts
          kubectl get nodes -o wide > artifacts/nodes.txt 2>&1 || true
          kubectl -n golden-demo get all -o wide > artifacts/resources.txt 2>&1 || true
          kubectl -n golden-demo get events --sort-by=.lastTimestamp > artifacts/events.txt 2>&1 || true
          kubectl -n golden-demo logs deploy/prometheus > artifacts/prometheus.log 2>&1 || true
          cp /tmp/temporal.log artifacts/temporal.log 2>/dev/null || true
          cp /tmp/runtime-worker.log artifacts/runtime-worker.log 2>/dev/null || true
          cp /tmp/decision.log artifacts/decision.log 2>/dev/null || true
          cp /tmp/prometheus-pf.log artifacts/prometheus-port-forward.log 2>/dev/null || true
          cp /tmp/kube-proxy.log artifacts/kube-proxy.log 2>/dev/null || true
          {
            printf 'runner_sha=%s\n' "${{ steps.runner-ref.outputs.runner_sha }}"
            printf 'aiops_sha=%s\n' "$(git -C workspace/agentic-aiops rev-parse HEAD)"
            printf 'decision_sha=%s\n' "$(git -C workspace/agent-decision-lab rev-parse HEAD)"
            printf 'runtime_sha=%s\n' "$(git -C workspace/cloud-agent-runtime rev-parse HEAD)"
            printf 'control_plane_sha=%s\n' "$(git -C workspace/agent-control-plane rev-parse HEAD)"
          } > artifacts/refs.txt

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-e2e-${{ github.run_id }}
          path: artifacts/
          retention-days: 7
